name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            package: --win portable nsis --x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            package: --mac dmg --x64
          - os: macos-15
            platform: macos
            arch: arm64
            package: --mac dmg --arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            package: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build app
        run: npm run build
      - name: Package without publishing
        run: npx electron-builder ${{ matrix.package }} --publish never
      - name: Runtime smoke test
        shell: bash
        run: bash .github/scripts/smoke-runtime.sh "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/tokenpulse-smoke-*/*.log
            ${{ runner.temp }}/tokenpulse-smoke-*/*.txt
            ${{ runner.temp }}/tokenpulse-smoke-*/marks/*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: tokenpulse-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenpulse-*
          path: dist/release-artifacts
          merge-multiple: true
      - name: Verify release package set and write checksums
        run: node .github/scripts/release-packages.mjs dist/release-artifacts "${{ github.ref_name }}"
      - name: Upload verified packages to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Refusing to overwrite a published release"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes "Cross-platform packages built and startup-tested by GitHub Actions."
          fi
          gh release upload "$RELEASE_TAG" dist/release-artifacts/* --clobber
