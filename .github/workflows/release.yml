name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Tests & typecheck
        run: |
          npm run typecheck
          npm test

      - name: Build app
        run: npx electron-vite build

      - name: Package & publish (tag only)
        # workflow_dispatch 手动跑只出制品不上传；打了 v* 标签才发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - name: Runtime smoke test (启动 + 引导弹道探针)
        shell: bash
        run: |
          set -u
          LOG=/tmp/tp-app.log
          SMOKE=/tmp/tp-smoke
          rm -rf "$SMOKE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="./dist/win-unpacked/TokenPulse.exe"
            DB="$APPDATA/TokenPulse/agentmeter.db"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            BIN="./dist/mac/TokenPulse.app/Contents/MacOS/TokenPulse"
            DB="$HOME/Library/Application Support/TokenPulse/agentmeter.db"
          else
            BIN="./dist/linux-unpacked/tokenpulse"
            [ -x "$BIN" ] || BIN="./dist/linux-unpacked/TokenPulse"
            DB="$HOME/.config/TokenPulse/agentmeter.db"
          fi
          rm -f "$DB" "$DB-wal" "$DB-shm"
          export TOKENPULSE_SMOKE_DIR="$SMOKE"
          echo "launching: $BIN"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # CI 容器无 userns，chrome-sandbox 不可用（真实桌面无此问题），冒烟关闭沙箱
            xvfb-run -a "$BIN" --no-sandbox > "$LOG" 2>&1 &
            APP_PID=$!
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # 直接执行 .app 内部二进制缺 GUI 启动上下文会在框架初始化阶段挂起；
            # 经 LaunchServices 启动才能拿到 WindowServer 会话
            open --env TOKENPULSE_SMOKE_DIR="$SMOKE" ./dist/mac/TokenPulse.app
            APP_PID=""
          else
            "$BIN" > "$LOG" 2>&1 &
            APP_PID=$!
          fi
          # 主判据：boot 探针（bootstrap 完成）；ready 无 boot = 挂在引导，两者皆无 = 未就绪
          ok=0
          for i in $(seq 1 60); do
            if [ -f "$SMOKE/boot" ]; then ok=1; break; fi
            if [ -n "$APP_PID" ] && ! kill -0 $APP_PID 2>/dev/null; then break; fi
            sleep 1
          done
          sleep 2
          echo "---- 探针 ----"; ls "$SMOKE" 2>/dev/null || echo "（无）"
          echo "---- app log（尾部） ----"; tail -20 "$LOG" 2>/dev/null || true
          echo "---- db ----"; ls -la "$DB" 2>/dev/null || echo "（未创建）"
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //PID $APP_PID //T //F >/dev/null 2>&1 || true
          elif [ "$RUNNER_OS" = "macOS" ]; then
            osascript -e 'quit app "TokenPulse"' >/dev/null 2>&1 || pkill -f TokenPulse.app || true
          else
            kill $APP_PID 2>/dev/null || true
          fi
          sleep 2
          if [ "$ok" != "1" ]; then
            echo "::error::应用未在 60s 内完成引导（无 boot 探针）"
            exit 1
          fi
          echo "启动验证通过"

      - name: Upload artifacts (manual run inspection)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenpulse-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
