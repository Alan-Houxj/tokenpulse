name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Tests & typecheck
        run: |
          npm run typecheck
          npm test

      - name: Build app
        run: npx electron-vite build

      - name: Package & publish (tag only)
        # workflow_dispatch 手动跑只出制品不上传；打了 v* 标签才发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - name: Runtime smoke test (启动 + userData 落库断言)
        shell: bash
        run: |
          set -u
          LOG=/tmp/tp-app.log
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="./dist/win-unpacked/TokenPulse.exe"
            DB="$APPDATA/TokenPulse/agentmeter.db"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            BIN="./dist/mac/TokenPulse.app/Contents/MacOS/TokenPulse"
            DB="$HOME/Library/Application Support/TokenPulse/agentmeter.db"
          else
            # Linux 可执行名用包名（小写）
            BIN="./dist/linux-unpacked/tokenpulse"
            [ -x "$BIN" ] || BIN="./dist/linux-unpacked/TokenPulse"
            DB="$HOME/.config/TokenPulse/agentmeter.db"
          fi
          echo "launching: $BIN"
          rm -f "$DB" "$DB-wal" "$DB-shm"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$BIN" > "$LOG" 2>&1 &
          else
            "$BIN" > "$LOG" 2>&1 &
          fi
          APP_PID=$!
          # 引导必然创建 userData/agentmeter.db；stdout 重定向到文件时 Node 全缓冲，
          # 日志断言不可靠，改用落库副作用（日志仍打印做辅助诊断）
          ok=0
          for i in $(seq 1 60); do
            if [ -f "$DB" ]; then ok=1; break; fi
            if ! kill -0 $APP_PID 2>/dev/null; then break; fi
            sleep 1
          done
          sleep 3
          echo "---- app log ----"; cat "$LOG" 2>/dev/null || true
          echo "---- db ----"; ls -la "$DB" 2>/dev/null || echo "（未创建）"
          kill $APP_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::应用未在 60s 内完成启动（userData/agentmeter.db 未创建）"
            exit 1
          fi
          echo "启动验证通过"

      - name: Upload artifacts (manual run inspection)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenpulse-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
